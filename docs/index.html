<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Tracker</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --border: #22262f; --text: #e7e9ee;
    --muted: #8b94a3; --accent: #5b8cff; --good: #34c98f; --soon: #e0b13b; --later: #6b7280;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7fb; --panel: #ffffff; --border: #e3e6ec; --text: #191d24;
      --muted: #616b7a; --accent: #3a63d8; --good: #1f9d6f; --soon: #b8860b; --later: #7a828f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 28px 24px 12px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; }
  main { max-width: 1000px; margin: 0 auto; padding: 8px 24px 60px; }
  section { margin-top: 28px; }
  section h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.open { background: var(--good); } .dot.soon { background: var(--soon); } .dot.later { background: var(--later); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card .info { min-width: 0; }
  .card .firm { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .card .title { font-size: 15px; margin-top: 2px; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card a.btn { flex-shrink: 0; background: var(--accent); color: white; text-decoration: none; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }
  .status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pill { font-size: 11px; padding: 3px 9px; border-radius: 100px; border: 1px solid var(--border); color: var(--muted); }
  .pill.error { border-color: #c94f4f; color: #c94f4f; }
  .pill.low_confidence { border-color: var(--soon); color: var(--soon); }
  footer { max-width: 1000px; margin: 0 auto; padding: 0 24px 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Internship Tracker</h1>
  <div class="meta" id="generated">Loading…</div>
</header>
<main>
  <section>
    <h2><span class="dot open"></span>Open to me now</h2>
    <div id="open_now"></div>
  </section>
  <section>
    <h2><span class="dot soon"></span>Opens soon</h2>
    <div id="opens_soon"></div>
  </section>
  <section>
    <h2><span class="dot later"></span>Not yet eligible (junior seats — tracked for 2028)</h2>
    <div id="not_yet_eligible"></div>
  </section>
  <section id="needs_review_section" style="display:none">
    <h2>Needs review</h2>
    <div id="needs_review"></div>
  </section>
  <section>
    <h2>Firm check status</h2>
    <div class="status-row" id="firm_status"></div>
  </section>
</main>
<footer>Data refreshes hourly via GitHub Actions.</footer>
<script>
async function load() {
  const res = await fetch('dashboard.json?_=' + Date.now());
  const data = await res.json();

  document.getElementById('generated').textContent =
    'Last checked: ' + new Date(data.generated_at).toLocaleString();

  renderPostings('open_now', data.open_now, p => p.title);
  renderPostings('not_yet_eligible', data.not_yet_eligible, p => p.title);
  renderPostings('needs_review', data.needs_review || [], p => p.title);
  if ((data.needs_review || []).length) {
    document.getElementById('needs_review_section').style.display = '';
  }
  renderOpensSoon('opens_soon', data.opens_soon);

  const statusEl = document.getElementById('firm_status');
  statusEl.innerHTML = '';
  (data.firm_status || []).forEach(f => {
    const pill = document.createElement('span');
    pill.className = 'pill' + (f.status !== 'ok' ? ' ' + f.status : '');
    pill.title = f.detail || '';
    pill.textContent = f.firm + (f.status !== 'ok' ? ' (' + f.status + ')' : '');
    statusEl.appendChild(pill);
  });
}

function renderPostings(elId, items, titleFn) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  if (!items.length) {
    el.innerHTML = '<div class="empty">Nothing here right now.</div>';
    return;
  }
  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="info">
        <div class="firm">${escapeHtml(p.firm)}</div>
        <div class="title">${escapeHtml(titleFn(p))}</div>
        <div class="sub">First seen ${new Date(p.first_seen).toLocaleDateString()}</div>
      </div>
      <a class="btn" href="${escapeAttr(p.url)}" target="_blank" rel="noopener">Open</a>
    `;
    el.appendChild(card);
  });
}

function renderOpensSoon(elId, items) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  if (!items.length) {
    el.innerHTML = '<div class="empty">Nothing tracked here.</div>';
    return;
  }
  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="info">
        <div class="firm">${escapeHtml(p.firm)}</div>
        <div class="title">${escapeHtml(p.program_name)}</div>
        <div class="sub">${escapeHtml(p.note || 'Confirmed program — not yet posted')}</div>
      </div>
    `;
    el.appendChild(card);
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

load().catch(err => {
  document.getElementById('generated').textContent = 'Failed to load dashboard.json: ' + err;
});
</script>
</body>
</html>
