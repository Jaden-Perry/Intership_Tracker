name: Markets brief

on:
  schedule:
    - cron: "20 * * * 1-5"   # hourly (weekdays), at :20 past the hour
  workflow_dispatch:
    inputs:
      run_type:
        description: "Brief type"
        type: choice
        options: [evening, morning]
        default: evening

permissions:
  contents: write

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: deps-brief-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Determine run type
        id: run_type
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=evening" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.run_type || 'evening' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Send brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only the automatic hourly trigger gates on "after close, not
          # already sent today" - a manual run always sends immediately.
          MARKET_BRIEF_GATE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python scripts/market_brief.py ${{ steps.run_type.outputs.value }}

      - name: Record brief-sent state
        run: |
          git config user.name "market-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/market_brief_state.json ]; then
            git add data/market_brief_state.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record markets brief sent [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/5)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::failed to push brief-sent state after 5 attempts"
          exit 1
